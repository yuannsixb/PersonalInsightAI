<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/><stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d652d"/><stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e37400"/><stop offset="100%" stop-color="#fbbc04"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/><stop offset="100%" stop-color="#ce93d8"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5221f"/><stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
  </defs>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    PersonalInsightAI v2.0 — 数据流程图
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#888">
    基于上下文理解的个人数字行为分析系统
  </text>

  <!-- ===== 第 1 层：采集层（蓝色） ===== -->
  <rect x="250" y="80" width="400" height="60" rx="10" fill="url(#g1)" opacity="0.9"/>
  <text x="450" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="white">📡 用户行为采集</text>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#e8e8e8">agent.py | 每 10 秒采集一次 | ctypes Windows API</text>

  <!-- 箭头 1→2 -->
  <line x1="450" y1="140" x2="450" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 采集字段框 -->
  <rect x="150" y="185" width="600" height="55" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">采集字段</text>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#444">⏱ timestamp</text>
  <text x="380" y="228" text-anchor="middle" font-size="11" fill="#444">🖥 process_name</text>
  <text x="490" y="228" text-anchor="middle" font-size="11" fill="#444">📄 window_title</text>
  <text x="590" y="228" text-anchor="middle" font-size="11" fill="#444">🌐 url / domain</text>

  <!-- ===== 第 2 层：场景分类（绿色） ===== -->
  <line x1="450" y1="240" x2="450" y2="275" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="280" width="500" height="75" rx="10" fill="url(#g2)" opacity="0.9"/>
  <text x="450" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🧠 场景分类 v2.0（五级优先级）</text>
  <text x="450" y="328" text-anchor="middle" font-size="11" fill="#e8e8e8">scene_classifier.py | 输出 scene + subcategory + confidence</text>
  <text x="450" y="345" text-anchor="middle" font-size="10" fill="#c8e6c9">①②③④⑤ → 网站知识库 ＞ 应用知识库 ＞ 标题关键词 ＞ 时间段 ＞ 用户历史</text>

  <!-- 箭头 2→3 -->
  <line x1="450" y1="355" x2="450" y2="395" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 第 3 层：存储层 ===== -->
  <rect x="150" y="400" width="270" height="60" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="285" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c27b0">🗄 原始行为库</text>
  <text x="285" y="445" text-anchor="middle" font-size="10" fill="#666">behavior_log_v2</text>

  <rect x="480" y="400" width="270" height="60" rx="8" fill="#fff3e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="615" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#e37400">🗄 兼容旧表</text>
  <text x="615" y="445" text-anchor="middle" font-size="10" fill="#666">behavior_log（v1 向下兼容）</text>

  <!-- 箭头 3→合并 -->
  <line x1="450" y1="460" x2="450" y2="505" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 第 4 层：行为合并（橙色） ===== -->
  <rect x="200" y="510" width="500" height="70" rx="10" fill="url(#g3)" opacity="0.9"/>
  <text x="450" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔄 行为事件合并</text>
  <text x="450" y="558" text-anchor="middle" font-size="11" fill="#fff8e1">behavior_processor.py | 连续相同场景自动合并</text>
  <text x="450" y="573" text-anchor="middle" font-size="10" fill="#fff8e1">例：60条10s采样(Edge+抖音) → 1条(娱乐/短视频/10min)</text>

  <!-- 箭头 合并→合并库 -->
  <line x1="450" y1="580" x2="450" y2="620" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 合并库 -->
  <rect x="300" y="625" width="300" height="50" rx="8" fill="#fff8e1" stroke="#e37400" stroke-width="1.5"/>
  <text x="450" y="648" text-anchor="middle" font-size="12" font-weight="bold" fill="#e37400">🗄 合并行为库</text>
  <text x="450" y="665" text-anchor="middle" font-size="10" fill="#666">merged_behaviors</text>

  <!-- ===== 第 5 层：分析层（红色） ===== -->
  <line x1="450" y1="675" x2="450" y2="715" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="720" width="500" height="70" rx="10" fill="url(#g5)" opacity="0.9"/>
  <text x="450" y="748" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔬 智能分析流水线</text>
  <text x="450" y="768" text-anchor="middle" font-size="11" fill="#ffcdd2">reporter.py + recommendation.py</text>
  <text x="450" y="783" text-anchor="middle" font-size="10" fill="#ffcdd2">work/study → 自动化建议 | leisure → 娱乐记录 | life → 生活分析</text>

  <!-- 分叉箭头 -->
  <line x1="450" y1="790" x2="450" y2="830" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 第 6 层：输出 ===== -->
  <rect x="100" y="835" width="270" height="60" rx="8" fill="#e8f5e9" stroke="#34a853" stroke-width="1.5"/>
  <text x="235" y="858" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d652d">📊 Dashboard</text>
  <text x="235" y="878" text-anchor="middle" font-size="10" fill="#666">streamlit_app.py</text>
  <text x="235" y="890" text-anchor="middle" font-size="9" fill="#888">场景分布 · 行为时间线 · 优化建议</text>

  <rect x="530" y="835" width="270" height="60" rx="8" fill="#fff3e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="665" y="858" text-anchor="middle" font-size="12" font-weight="bold" fill="#e37400">📋 洞察报告</text>
  <text x="665" y="878" text-anchor="middle" font-size="10" fill="#666">reporter.py → reports/</text>
  <text x="665" y="890" text-anchor="middle" font-size="9" fill="#888">每 6 小时自动生成</text>

  <!-- ===== 底部旁路：知识库 ===== -->
  <rect x="50" y="920" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1" stroke-dasharray="4"/>
  <text x="150" y="942" text-anchor="middle" font-size="11" fill="#1a73e8">📚 网站知识库</text>
  <text x="150" y="958" text-anchor="middle" font-size="9" fill="#666">website_knowledge.json</text>
  <line x1="250" y1="945" x2="380" y2="320" stroke="#1a73e8" stroke-width="1" stroke-dasharray="5"/>

  <rect x="650" y="920" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1" stroke-dasharray="4"/>
  <text x="750" y="942" text-anchor="middle" font-size="11" fill="#1a73e8">📗 应用知识库</text>
  <text x="750" y="958" text-anchor="middle" font-size="9" fill="#666">APP_KNOWLEDGE_BASE</text>
  <line x1="650" y1="945" x2="520" y2="320" stroke="#1a73e8" stroke-width="1" stroke-dasharray="5"/>

  <!-- 图例 -->
  <rect x="50" y="1000" width="800" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="70" y="1015" width="14" height="14" rx="3" fill="#1a73e8"/>
  <text x="88" y="1027" font-size="10" fill="#555">采集层</text>
  <rect x="170" y="1015" width="14" height="14" rx="3" fill="#34a853"/>
  <text x="188" y="1027" font-size="10" fill="#555">分类层</text>
  <rect x="270" y="1015" width="14" height="14" rx="3" fill="#9c27b0"/>
  <text x="288" y="1027" font-size="10" fill="#555">存储层</text>
  <rect x="370" y="1015" width="14" height="14" rx="3" fill="#fbbc04"/>
  <text x="388" y="1027" font-size="10" fill="#555">合并层</text>
  <rect x="470" y="1015" width="14" height="14" rx="3" fill="#ea4335"/>
  <text x="488" y="1027" font-size="10" fill="#555">分析层</text>
  <rect x="570" y="1015" width="14" height="14" rx="3" fill="#34a853"/>
  <text x="588" y="1027" font-size="10" fill="#555">输出层</text>
  <rect x="680" y="1015" width="14" height="14" rx="3" fill="#e3f2fd" stroke="#1a73e8" stroke-width="1"/>
  <text x="698" y="1027" font-size="10" fill="#555">知识库</text>

  <text x="450" y="1055" text-anchor="middle" font-size="9" fill="#aaa">版本 2.0 | 采集间隔 10s | 五级场景分类 | 行为合并引擎</text>
</svg>
